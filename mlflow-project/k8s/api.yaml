apiVersion: apps/v1
kind: Deployment
metadata:
  name: adult-api
  namespace: mlops
  labels:
    app: adult-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: adult-api
  template:
    metadata:
      labels:
        app: adult-api
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: adult-api
      containers:
        - name: api
          image: adult-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_URI
              value: models:/adult-income-classifier@production
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5001
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # Da tiempo a que el pod salga de los endpoints antes de recibir SIGTERM.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: adult-api
  namespace: mlops
spec:
  type: NodePort
  selector:
    app: adult-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 31446
