apiVersion: apps/v1
kind: Deployment
metadata:
  name: adult-ui
  namespace: mlops
  labels:
    app: adult-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adult-ui
  template:
    metadata:
      labels:
        app: adult-ui
    spec:
      containers:
        - name: ui
          image: adult-ui:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: http://adult-api:8000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: adult-ui
  namespace: mlops
spec:
  type: LoadBalancer
  selector:
    app: adult-ui
  ports:
    - port: 5002
      targetPort: 8501
