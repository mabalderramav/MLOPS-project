apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: practica1
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - protocol: TCP
      port: 80 # Puerto del Service dentro del clúster
      targetPort: 80 # Puerto del contenedor
      nodePort: 31446 # Puerto que k3d publica en localhost
