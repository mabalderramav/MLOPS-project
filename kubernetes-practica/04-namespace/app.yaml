apiVersion: apps/v1
kind: Deployment # Defines the resource type as a Deployment
metadata:
  name: hello-deployment # Name of the deployment
spec:
  replicas: 3 # Number of pod replicas to create for this deployment
  selector: # Selector to identify the pods managed by this deployment
    matchLabels:
      app: hello
  template: # Template for the pods managed by this deployment
    metadata: # Metadata for the pod template
      labels: # Labels for the pod template
        app: hello # Label to identify the application within the pod template
    spec: # Specification of the pod's desired behavior
      containers: # List of containers within the pod
        - name: web # Name of the container
          image: hashicorp/http-echo:1.0 # Container image to use
          args: ["-text=holasip"] # Arguments to pass to the container, using the pod's name
          ports: # List of ports to expose from the container
            - containerPort: 5678 # Port number the container listens on
