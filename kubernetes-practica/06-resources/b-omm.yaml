apiVersion: v1
kind: Pod
metadata:
  name: oom-pod
  namespace: lab-resources
spec:
  containers:
    - name: app
      image: python:3.12-slim
      command: ["python", "-c"]
      args:
        - |
          import time
          datos =[]
          for i in range(1, 51):
              datos.append(b"x" * 10 * (1024 * 1024))  # Allocate 1 MiB of memory each iteration
              print(f"Memory used: ~{i * 10} MiB", flush=True)
              time.sleep(0.5)  # Sleep for a short time to simulate processing

      resources:
        requests:
          memory: "50Mi"
        limits:
          memory: "100Mi"
